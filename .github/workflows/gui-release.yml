name: Flutter desktop release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gui-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Flutter 3.38.7
        run: |
          git clone --depth 1 --branch 3.38.7 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare official relinker and runtime
        run: ./tools/setup_gui.ps1
      - name: Test and compile Windows application
        working-directory: gui
        run: |
          flutter --no-version-check pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter --no-version-check analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter --no-version-check test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter --no-version-check build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable application
        run: ./tools/package_gui.ps1 -Version 1.0.0
      - name: Prepare release notes
        run: |
          @'
          ## AnyPS5 Studio 1.0.0

          Interface Flutter para Windows x64, em portugues, com parametros de conversao e execucao, perfis e logs.

          **Download:** baixe `AnyPS5-Studio-1.0.0-windows-x64.zip`, extraia tudo e abra `Iniciar AnyPS5.cmd`.

          O pacote inclui o relinker e as bibliotecas oficiais AnyPS5 v0.1.3. Nao exige Flutter, Visual Studio ou Python. Arquivo SHA-256 incluido para verificacao do download.

          Jogos e recursos devem ser fornecidos pelo usuario. A compatibilidade depende do AnyPS5.

          Validacao: analise estatica, sete testes Flutter e compilacao Windows Release.
          '@ | Set-Content -LiteralPath dist/release-notes.md -Encoding utf8
      - name: Create release and upload assets
        run: |
          gh release create gui-v1.0.0 dist/*.zip dist/*.sha256.txt --target "$env:GITHUB_SHA" --draft --title "AnyPS5 Studio 1.0.0 - Windows x64" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit gui-v1.0.0 --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
